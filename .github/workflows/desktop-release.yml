name: Desktop release

on:
  push:
    tags:
      - 'app-v*'
      - 'mac-v*'
      - 'win-v*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" == app-v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#app-v}"
            BUILD_MAC=true
            BUILD_WIN=true
          elif [[ "$GITHUB_REF_NAME" == mac-v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#mac-v}"
            BUILD_MAC=true
            BUILD_WIN=false
          elif [[ "$GITHUB_REF_NAME" == win-v* ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#win-v}"
            BUILD_MAC=false
            BUILD_WIN=true
          else
            echo "Unknown tag format: $GITHUB_REF_NAME"
            exit 1
          fi
          
          PACKAGE_VERSION="$(bun -p "require('./package.json').version")"
          TAURI_VERSION="$(bun -p "require('./src-tauri/tauri.conf.json').version")"
          CARGO_VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          test "$TAG_VERSION" = "$PACKAGE_VERSION"
          test "$TAG_VERSION" = "$TAURI_VERSION"
          test "$TAG_VERSION" = "$CARGO_VERSION"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          
          echo "build_mac=$BUILD_MAC" >> "$GITHUB_ENV"
          echo "build_win=$BUILD_WIN" >> "$GITHUB_ENV"

      - id: matrix
        shell: bash
        run: |
          MATRIX_JSON="[]"
          if [ "$build_mac" = true ]; then
            MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c '. + [{"runner":"macos-14","target":"aarch64-apple-darwin","platform":"darwin-aarch64","bundles":"app,dmg"}]')
          fi
          if [ "$build_win" = true ]; then
            MATRIX_JSON=$(echo "$MATRIX_JSON" | jq -c '. + [{"runner":"windows-latest","target":"x86_64-pc-windows-msvc","platform":"windows-x86_64","bundles":"nsis"}]')
          fi
          echo "matrix={\"include\":$MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validate.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

      - name: Import Apple signing certificate
        if: runner.os == 'macOS' && env.APPLE_CERTIFICATE != ''
        shell: bash
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/call3.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/call3-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'call3.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          $config = @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = 'sha256'; timestampUrl = 'http://timestamp.digicert.com' } } } | ConvertTo-Json -Compress
          "TAURI_CONFIG=$config" >> $env:GITHUB_ENV

      - name: Build signed desktop application
        run: bun tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect updater artifacts
        run: >-
          bun scripts/desktop-artifact.ts collect
          --platform ${{ matrix.platform }}
          --target-dir src-tauri/target/${{ matrix.target }}/release/bundle
          --output-dir desktop-artifact
          --base-url https://downloads.call3.dev
          --version ${{ needs.validate.outputs.version }}

      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: call3-${{ matrix.platform }}
          path: desktop-artifact/
          if-no-files-found: error

  publish:
    needs: [validate, build]
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET: call3-desktop-releases
      RELEASE_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          path: desktop-artifacts
          merge-multiple: true
      - name: Fetch existing manifest
        shell: bash
        run: |
          bun wrangler r2 object get "$R2_BUCKET/channels/stable.json" --file existing-stable.json --remote || echo "No existing manifest found."
      - name: Create release manifest
        run: >-
          bun scripts/desktop-artifact.ts manifest
          --input-dir desktop-artifacts
          --output stable.json
          --version "$RELEASE_VERSION"
          --notes "Call3 $RELEASE_VERSION"
          --merge-manifest existing-stable.json
      - name: Upload immutable release artifacts
        shell: bash
        run: |
          while IFS= read -r -d '' FILE; do
            NAME="$(basename "$FILE")"
            bun wrangler r2 object put "$R2_BUCKET/desktop/stable/$RELEASE_VERSION/$NAME" --file "$FILE" --remote
          done < <(find desktop-artifacts -type f ! -name '*.json' -print0)
      - name: Publish stable update manifest
        run: bun wrangler r2 object put "$R2_BUCKET/channels/stable.json" --file stable.json --remote
